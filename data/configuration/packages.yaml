packages:
  apt:
    - git
    - make
    - ripgrep
    - tree
    - xclip
    - ca-certificates
    - curl
    - golang-go
    - zsh
    - flatpak
    - gnome-software-plugin-flatpak
    - python3
    - python3-pip
    - python3-venv
    - pipx

  snap:
    - name: nvim
      classic: true
    - name: vlc
      classic: false

  npm:
    - tree-sitter-cli

  pipx:
    - pre-commit

npm_bootstrap:
  enabled: true
  install_script_url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.6/install.sh
  node_version: "26"

commands:
  post:
    - run: sudo snap remove firefox
    - run: sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    - run: sudo curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
    - run: sudo apt update
    - run: sudo apt install -y brave-browser
    - run: sudo add-apt-repository -y ppa:obsproject/obs-studio
    - run: sudo apt install -y obs-studio
    - run: cp ~/.config/zsh/.zshenv ~/.zshenv
    - run: sudo usermod -s "$(command -v zsh)" "$USER"
    - run: flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - run: cp data/background ~/.config/background
    - run: cp ~/.config/nvim/font/HackNerdFont-Regular.ttf ~/.local/share/fonts/
    - run: command -v docker >/dev/null 2>&1 || curl -fsSL https://get.docker.com | sudo sh
    - run: sudo usermod -aG docker "$USER"
    - run: sudo apt autoremove -y

repos:
  - url: https://github.com/maxogod/maxoform
    dest: ~/.config/maxoform

  - url: https://github.com/maxogod/maxo-nvim.git
    dest: ~/.config/nvim

  - url: https://github.com/maxogod/maxo-zsh.git
    dest: ~/.config/zsh

  - url: https://github.com/zsh-users/zsh-autosuggestions.git
    dest: ~/.zsh/zsh-autosuggestions

  - url: https://github.com/wbthomason/packer.nvim
    dest: ~/.local/share/nvim/site/pack/packer/start/packer.nvim

settings:
  import_dconf: true
  git_user_name: "maxogod"
  git_user_email: "105026197+maxogod@users.noreply.github.com"
  git_core_editor: "nvim"
  should_setup_ssh: true
  ssh_key_path: "~/.ssh/id_ed25519"
  swap_file_path: "/swap.img"
  swap_size_gb: 8
